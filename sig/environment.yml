name: sig
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Audio processing
  - librosa
  - numpy
  - scipy
  # Montreal Forced Aligner + dependencies (conda-only)
  - montreal-forced-aligner
  - openfst
  - kaldi
  - kalpy
  # Jupyter
  - ipykernel
  - jupyter
  # General
  - pyyaml
  - h5py
  - pip
  - pip:
      # PyTorch with CUDA 12.6 GPU support (pip wheels bundle CUDA runtime)
      - --index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchaudio
      # ESPnet (speech processing / POWSM model)
      - espnet==202412
      - espnet-model-zoo==0.1.7
      # Audio codec support
      - soundfile
      - av
      # IPA / phoneme utilities
      - cmudict
      - jamo==0.4.1
      - sentencepiece
      # TextGrid parsing (for MFA output)
      - textgrid
      # NLP
      - nltk
      # Other
      - protobuf
      - configargparse
      - filelock
      - humanfriendly
      - opt-einsum
