services:
  # -----------------------------------------------------
  # 1. The Gateway (Mimics RunPod Cloud API)
  # -----------------------------------------------------
  runpod-proxy:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./mod/dev:/app
    command: >
      bash -c "pip install fastapi uvicorn httpx pydantic && 
      uvicorn runpod_proxy:app --host 0.0.0.0 --port 5000 --reload"
    ports:
      - "8008:5000"
    environment:
      # Maps ENDPOINT_ID -> WORKER_URL
      # These IDs must match what your Frontend/App sends to /v2/{ID}/run
      - 'WORKER_MAP={"pronunciation-assessment": "http://worker-assessment:8000"}'
    networks:
      - runpod-net

  # -----------------------------------------------------
  # 2. Assessment Worker (The Heavy Lifter)
  # -----------------------------------------------------
  worker-assessment:
    build:
      context: ./mod
      dockerfile: assessment/Dockerfile
    environment:
      - RUNPOD_DEBUG=true
      - RUNPOD_PORT=8000
      - RUNPOD_API_HOST=0.0.0.0

    command: python3 assessment/handler.py --rp_serve_api --rp_api_host 0.0.0.0
    volumes:
      # Optional: Mount code for hot-reloading if your handler supports it (RunPod SDK might not auto-reload)
      - ./mod/assessment:/worker/assessment
      - ./mod/shared:/worker/shared
      - ./mod/alignment.py:/worker/alignment.py
      - ./mod/precompute_references.py:/worker/precompute_references.py
      - ./mod/dev:/worker/dev
      # split_audio.py runs in-container too (ffmpeg is in the image, no host install needed).
      - ./scripts:/worker/scripts
      # Audio fixtures + manifest for the offline verify harness. Read-write so
      # `verify.py align-refs --save` can write golden *.expected.json back to the host,
      # and so split_audio.py can write cut clips into data/.
      - ./data:/data
    networks:
      - runpod-net
    # No ports exposed to host needed, only proxy talks to it.
    # But exposing 8001 for debugging might be useful.
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  runpod-net:
    driver: bridge
